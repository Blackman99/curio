<style>

 background:

  radial-gradient(ellipse 40% 35% at 15% 80%,#c41e3a18 0%,transparent 45%),

 -webkit-user-select:none;user-select:none}

 box-shadow:0 0 6px #c9a24a55;transform:translateZ(1px)}

 transform-origin:50% 80%;will-change:transform}

.horse .tag{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font:700 8px/1 'Special Elite',monospace;

input[type=range]{width:100%;accent-color:var(--crimson)}
#btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:900 13px/1 'Cinzel Decorative',serif;letter-spacing:.1em;border:0;border-radius:4px;padding:11px 4px;cursor:pointer;
 color:var(--cream);background:linear-gradient(#e05060,#c41e3a 45%,#8a1028);

button.small{font-size:11px;padding:9px 2px;background:linear-gradient(#e8d090,#c9a24a 50%,#8a7028);
 box-shadow:inset 0 1px 0 #fff8,0 3px 0 #5a4820;color:#1a1218}

button.down{transform:translateY(3px);box-shadow:inset 0 1px 0 #ff8a9888,0 0 0 #5a0818}
#readout{font:400 11px/1.45 'Special Elite',monospace;letter-spacing:.02em;color:#d8c8a8;text-align:left;
 background:#0e0a0c;border:1px solid #c9a24a44;border-radius:3px;padding:7px 8px}
#readout b{color:var(--crimson)}
#readout .g{color:var(--gilt)}
#phasorwrap{background:#0e0a0c;border:1px solid #c9a24a55;border-radius:3px;padding:6px;text-align:center}

#note{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;
 padding:0 12px;color:#d8c8a8;font:400 11px/1.25 'Libre Baskerville',serif;text-align:center;
 background:linear-gradient(#0000,#0e0a0ccc)}
#note a{white-space:nowrap;color:var(--crimson);text-decoration:none;font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:.06em;font-weight:700}

@media(max-width:760px){#plate .no{display:none}#plate{flex-wrap:wrap;gap:4px}#carousel{transform:rotateX(62deg) translateY(10px) scale(.92)}}
</style></head><body>
<div id="wrap">
 <header id="sign">

 <div id="stage">
  <section id="fair" aria-label="Victorian RoPE carousel">

        </pattern>
       </defs>
       <ellipse cx="200" cy="155" rx="190" ry="18" fill="#00000055"/>
       <path d="M20 150 Q200 10 380 150 L360 155 Q200 40 40 155 Z" fill="url(#stripes)" stroke="#c9a24a" stroke-width="3"/>
       <path d="M20 150 Q200 10 380 150" fill="none" stroke="#e8d090" stroke-width="2" opacity=".7"/>
       <circle cx="200" cy="48" r="14" fill="#c9a24a" stroke="#e8d090" stroke-width="2"/>
       <circle cx="200" cy="48" r="6" fill="#c41e3a"/>
       <g fill="#e8d090" opacity=".9">
        <circle cx="55" cy="140" r="4"/><circle cx="100" cy="100" r="4"/><circle cx="150" cy="70" r="4"/>

    <input id="pos" type="range" min="0" max="64" step="0.05" value="0"></div>

 </div>

<svg id="ghost" viewBox="0 0 30 34" aria-hidden="true"><path d="M3 2 L3 26 L9.5 20.5 L13.5 30 L18 28 L14 19 L23 19 Z" fill="#fffaf0" stroke="#1c1610" stroke-width="2.2" stroke-linejoin="round"/></svg><div id="ring"></div>
<script>
(()=>{
const Q=new URLSearchParams(location.search),FIXED=Q.has('fixed');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(RM)document.body.classList.add('rm');
let seed=(+Q.get('seed'))||(FIXED?7:(Math.random()*1e9)|0);
const rand=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,eio=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};

/* ---- RoPE params ---- */
const BASE=10000;
let nPairs=16, m=0, mTarget=0, sel=0, auto=true, soundOn=true;
let baseAngles=[], accents=[], morphT=1, morphFrom=[], morphTo=[];
let simT=0, phT=0, userUntil=-1, platformAngle=0;
let lightPhase=0;

function theta(i,d){return Math.pow(BASE,-2*i/d)}
function thetas(){const t=[];for(let i=0;i<nPairs;i++)t.push(theta(i,nPairs*2));return t}
function reseed(hard){
 morphFrom=baseAngles.slice();
 accents=Array.from({length:nPairs},()=>rand());
 morphTo=Array.from({length:nPairs},(_,i)=>rand()*Math.PI*2+(i*0.37));
 if(hard||!morphFrom.length){baseAngles=morphTo.slice();morphT=1}
 else morphT=0;
 chime();
}
function ensureAngles(){
 while(baseAngles.length<nPairs)baseAngles.push(rand()*Math.PI*2);
 baseAngles.length=nPairs;
 while(accents.length<nPairs)accents.push(rand());
 accents.length=nPairs;
}

/* ---- SVG horse ---- */
const HORSE_COLS=['#c41e3a','#f4e8d0','#c9a24a','#e05060','#e8d090','#a01828'];
function horseSVG(col,brass){
 return `<svg viewBox="0 0 64 56" aria-hidden="true"><defs>
  <linearGradient id="hg${col.replace('#','')}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${col}"/><stop offset="100%" stop-color="#1a1218"/></linearGradient>
 </defs>
 <ellipse cx="32" cy="50" rx="14" ry="3" fill="#0006"/>
 <path d="M12 36 Q8 28 14 22 Q18 16 26 18 L30 14 Q34 10 40 14 L46 18 Q54 16 56 24 Q58 32 52 36 L48 40 Q42 44 34 42 L22 42 Q14 42 12 36Z"
  fill="url(#hg${col.replace('#','')})" stroke="${brass}" stroke-width="1.4"/>
 <path d="M40 16 Q48 8 54 14" fill="none" stroke="${brass}" stroke-width="1.5"/>
 <circle cx="44" cy="20" r="1.6" fill="#1a1218"/>
 <path d="M20 42 L18 52 M28 42 L28 52 M36 42 L38 52 M44 40 L48 50" stroke="${brass}" stroke-width="2" stroke-linecap="round"/>
 <circle cx="32" cy="30" r="3" fill="${brass}" opacity=".85"/>
 <path d="M24 28 Q32 34 40 28" fill="none" stroke="#fff6" stroke-width="1"/>
 </svg>`;
}

/* ---- build horses + lights ---- */
const horsesEl=$('#horses'), lightsEl=$('#lights'), platform=$('#platform');
function buildHorses(){
 ensureAngles();
 horsesEl.innerHTML='';
 lightsEl.innerHTML='';
 const N=nPairs;
 for(let i=0;i<N;i++){
  const col=HORSE_COLS[i%HORSE_COLS.length];
  const el=document.createElement('div');
  el.className='horse'+(i===sel?' sel':'');
  el.dataset.i=i;
  el.innerHTML=`<div class="tag">i=${i}</div><div class="pole"></div><div class="bob">${horseSVG(col,'#c9a24a')}</div>`;
  el.addEventListener('click',e=>{e.stopPropagation();sel=i;updateSel();playTone(thetas()[i])});
  horsesEl.appendChild(el);
 }
 const nL=16;
 for(let i=0;i<nL;i++){
  const L=document.createElement('div');L.className='light';
  const a=i/nL*Math.PI*2,r=48;
  L.style.transform=`translate(${Math.cos(a)*r}%,${Math.sin(a)*r}%)`;
  lightsEl.appendChild(L);
 }
 $$('#dimrow button').forEach(b=>b.classList.toggle('on',+b.dataset.d===nPairs));
 updateSel();renderThetas();
}
function updateSel(){
 $$('.horse').forEach(h=>h.classList.toggle('sel',+h.dataset.i===sel));
 $('#selLab').textContent=String(sel);
}
function renderThetas(){
 const th=thetas();
 const show=th.slice(0,Math.min(6,th.length)).map((t,i)=>`<span>θ<sub>${i}</sub>=<b>${t.toFixed(4)}</b></span>`).join('');
 $('#thetas').innerHTML=show+(th.length>6?`<span class="g">… +${th.length-6}</span>`:'');
}

/* ---- layout horses in ring ---- */
function layoutHorses(mNow,t){
 const th=thetas();
 const kids=[...horsesEl.children];
 const morph=eio(morphT);
 const N=kids.length||1;
 // platform rotates with m (slow visual)
 platformAngle=mNow*th[0]*0.35;
 platform.style.transform=`translate(-50%,-50%) translateZ(8px) rotateZ(${platformAngle}rad)`;
 horsesEl.style.transform=`translate(-50%,-50%) translateZ(10px) rotateZ(${platformAngle}rad)`;
 kids.forEach((el,i)=>{
  const base=lerp(morphFrom[i]??baseAngles[i],morphTo[i]??baseAngles[i],morph);
  if(morphT>=1)baseAngles[i]=base;
  const place=base; // physical slot on ring
  const phase=mNow*th[i]; // RoPE phase
  const R=42; // % of container
  const x=Math.cos(place)*R, y=Math.sin(place)*R;
  // bob up/down with phase; also subtle facing from phase
  const bob=Math.sin(phase+t*1.2+accents[i]*6.28)*10;
  const face=phase*57.3*0.15;
  el.style.transform=`translate(${x}%,${y}%) rotateZ(${-platformAngle}rad) translateZ(${8+bob*0.3}px)`;
  const bobEl=el.querySelector('.bob');
  if(bobEl) bobEl.style.transform=`translateY(${-bob}px) rotateZ(${face}deg)`;
  // depth sort
  el.style.zIndex=String(100+Math.round(y));
 });
 // canopy lights blink
 const lights=[...lightsEl.children];
 lights.forEach((L,i)=>{
  const on=((Math.sin(lightPhase*3+i*0.8)+1)/2)>.35;
  L.style.opacity=on?1:0.25;
  L.style.background=i%3===0?'#c41e3a':(i%3===1?'#e8d090':'#f4e8d0');
 });
}

/* ---- phasor canvas ---- */
const pcv=$('#phasor'), pctx=pcv.getContext('2d');
function drawPhasor(mNow){
 const th=thetas()[sel]||0;
 const ang=mNow*th;
 const W=pcv.width,H=pcv.height,cx=W/2,cy=H/2,R=Math.min(W,H)*0.36;
 pctx.clearRect(0,0,W,H);
 // grid
 pctx.strokeStyle='#c9a24a33';pctx.lineWidth=1;
 pctx.beginPath();pctx.moveTo(8,cy);pctx.lineTo(W-8,cy);pctx.moveTo(cx,8);pctx.lineTo(cx,H-8);pctx.stroke();
 pctx.beginPath();pctx.arc(cx,cy,R,0,Math.PI*2);pctx.strokeStyle='#c9a24a55';pctx.stroke();
 // trail
 pctx.beginPath();
 for(let k=0;k<=48;k++){
  const a=(mNow-k*0.35)*th;
  const x=cx+Math.cos(a)*R,y=cy-Math.sin(a)*R;
  if(k===0)pctx.moveTo(x,y);else pctx.lineTo(x,y);
 }
 pctx.strokeStyle='#c41e3a55';pctx.lineWidth=2;pctx.stroke();
 // phasor
 const x=cx+Math.cos(ang)*R,y=cy-Math.sin(ang)*R;
 pctx.beginPath();pctx.moveTo(cx,cy);pctx.lineTo(x,y);pctx.strokeStyle='#c41e3a';pctx.lineWidth=2.5;pctx.stroke();
 pctx.beginPath();pctx.arc(x,y,5,0,Math.PI*2);pctx.fillStyle='#e8d090';pctx.fill();
 pctx.beginPath();pctx.arc(cx,cy,3,0,Math.PI*2);pctx.fillStyle='#c9a24a';pctx.fill();
 // labels
 pctx.fillStyle='#d8c8a8';pctx.font='10px Special Elite,monospace';
 pctx.fillText('Re',W-22,cy-6);pctx.fillText('Im',cx+6,16);
 pctx.fillStyle='#e8d090';pctx.fillText(`θ=${th.toFixed(4)}`,10,H-10);
 pctx.fillText(`∠=${(ang%(Math.PI*2)).toFixed(2)}`,W/2+8,H-10);
}

/* ---- readout ---- */
function updateReadout(mNow){
 const th=thetas();
 const d=nPairs*2;
 $('#posval').innerHTML=`${mNow.toFixed(1)}<small>token</small>`;
 $('#poslab').textContent=mNow.toFixed(2);
 $('#readout').innerHTML=`pairs <b>${nPairs}</b> · d=<span class="g">${d}</span><br>
 selected <b>i=${sel}</b> · θ=<span class="g">${(th[sel]||0).toFixed(5)}</span><br>
 phase mθ=<b>${(mNow*(th[sel]||0)).toFixed(3)}</b> rad<br>
 <span class="g">cos=${Math.cos(mNow*(th[sel]||0)).toFixed(3)} · sin=${Math.sin(mNow*(th[sel]||0)).toFixed(3)}</span>`;
}

/* ---- audio (calliope-ish) ---- */
let actx=null, master=null;
function initAudio(){
 if(actx)return;
 try{
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();master.gain.value=0.08;master.connect(actx.destination);
 }catch(e){actx=null}
}
function tone(freq,dur,type,gain){
 if(!soundOn||!actx)return;
 try{
  if(actx.state==='suspended')actx.resume();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0,actx.currentTime);
  g.gain.linearRampToValueAtTime(gain||0.12,actx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+(dur||0.25));
  o.connect(g);g.connect(master);o.start();o.stop(actx.currentTime+(dur||0.25)+0.05);
 }catch(e){}
}
function chime(){
 if(!soundOn)return;initAudio();
 [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.1),i*70));
}
function playTone(th){
 if(!soundOn)return;initAudio();
 const f=220+th*800;tone(f,0.2,'sine',0.09);tone(f*1.5,0.15,'triangle',0.05);
}
function softTick(){
 if(!soundOn||!actx)return;
 tone(330+rand()*80,0.06,'sine',0.03);
}

/* ---- interaction ---- */
const fair=$('#fair'), posIn=$('#pos');
let dragging=false, lastX=0;
fair.addEventListener('pointerdown',e=>{
 if(e.target.closest('.horse'))return;
 dragging=true;lastX=e.clientX;fair.setPointerCapture(e.pointerId);
 userUntil=simT+4;initAudio();
});
fair.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX;lastX=e.clientX;
 mTarget=clamp(mTarget+dx*0.08,0,64);
 posIn.value=mTarget;
 userUntil=simT+4;
});
fair.addEventListener('pointerup',()=>dragging=false);
fair.addEventListener('pointercancel',()=>dragging=false);
posIn.addEventListener('input',()=>{mTarget=+posIn.value;userUntil=simT+5;initAudio()});
$$('#dimrow button').forEach(b=>b.addEventListener('click',()=>{
 nPairs=+b.dataset.d;sel=Math.min(sel,nPairs-1);reseed(true);buildHorses();initAudio();
}));
$('#spinBtn').addEventListener('click',()=>{reseed(false);userUntil=simT+2;initAudio();
 $('#spinBtn').classList.add('down');setTimeout(()=>$('#spinBtn').classList.remove('down'),120)});
$('#auto').addEventListener('click',()=>{auto=!auto;$('#auto').textContent='AUTO: '+(auto?'ON':'OFF');$('#auto').classList.toggle('off',!auto)});
$('#snd').addEventListener('click',()=>{soundOn=!soundOn;$('#snd').textContent='SOUND: '+(soundOn?'ON':'OFF');$('#snd').classList.toggle('off',!soundOn);if(soundOn)initAudio()});
pcv.addEventListener('click',()=>{sel=(sel+1)%nPairs;updateSel();playTone(thetas()[sel])});
window.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();reseed(false);userUntil=simT+2;initAudio()}
 if(e.key==='ArrowRight'){mTarget=clamp(mTarget+0.5,0,64);posIn.value=mTarget;userUntil=simT+3}
 if(e.key==='ArrowLeft'){mTarget=clamp(mTarget-0.5,0,64);posIn.value=mTarget;userUntil=simT+3}
});

/* ---- ghost autopilot ---- */
const ghost=$('#ghost'), ring=$('#ring');
let script=null;
function startScript(){
 if(RM&&!FIXED)return;
 const kind=rand();
 if(kind<.45){
  // drag position
  const from=mTarget,to=clamp(from+(rand()-.3)*18,0,64);
  script={type:'drag',t:0,dur:2.2+rand()*1.5,from,to,x0:fair.getBoundingClientRect().left+fair.clientWidth*0.3,
   y0:fair.getBoundingClientRect().top+fair.clientHeight*0.55};
 }else if(kind<.7){
  script={type:'spin',t:0,dur:1.2,done:false};
 }else{
  script={type:'sel',t:0,dur:1.0,idx:(sel+1+((rand()*3)|0))%nPairs,done:false};
 }
}
function runScript(dt){
 if(!script)return;
 script.t+=dt;
 const u=clamp(script.t/script.dur,0,1);
 ghost.style.opacity=u<.1?u*10:u>.85?(1-u)/.15:1;
 ring.style.opacity=ghost.style.opacity*.7;
 if(script.type==='drag'){
  const x=script.x0+eio(u)*(script.to-script.from)*8;
  const y=script.y0+Math.sin(u*Math.PI)*12;
  ghost.style.transform=`translate(${x}px,${y}px)`;
  ring.style.transform=`translate(${x}px,${y}px)`;
  mTarget=lerp(script.from,script.to,eio(u));
  posIn.value=mTarget;
 }else if(script.type==='spin'){
  const r=$('#spinBtn').getBoundingClientRect();
  const x=r.left+r.width/2-15,y=r.top+r.height/2-17;
  ghost.style.transform=`translate(${x}px,${y}px)`;
  ring.style.transform=`translate(${x+15}px,${y+17}px)`;
  if(u>.45&&!script.done){script.done=true;reseed(false)}
 }else if(script.type==='sel'){
  const el=horsesEl.children[script.idx];
  if(el){
   const r=el.getBoundingClientRect();
   const x=r.left+r.width/2-15,y=r.top+r.height/2-17;
   ghost.style.transform=`translate(${x}px,${y}px)`;
   ring.style.transform=`translate(${x+15}px,${y+17}px)`;
   if(u>.5&&!script.done){script.done=true;sel=script.idx;updateSel();playTone(thetas()[sel])}
  }
 }
 if(u>=1){script=null;ghost.style.opacity=0;ring.style.opacity=0;userUntil=simT+1.5}
}

/* ---- frame ---- */
function layoutNarrow(){
 const narrow=innerWidth<640;document.body.classList.toggle('narrow',narrow);
}
layoutNarrow();
addEventListener('resize',layoutNarrow);

let last=0;window.__frame=0;
function frame(ts){
 const dt0=FIXED?(1/60):Math.min(0.05,((ts-last)||16.7)/1000);
 last=ts||last;
 const dt=dt0*(RM?.45:1);
 simT+=dt;window.__frame++;phT+=dt;lightPhase+=dt;
 if(morphT<1)morphT=clamp(morphT+dt/(RM?1.6:0.9),0,1);

 // smooth m toward target
 m=lerp(m,mTarget,1-Math.exp(-dt*6));

 // idle autopilot: slowly advance m
 if(auto&&simT>userUntil){
  mTarget=clamp(mTarget+dt*(RM?0.35:0.85),0,64);
  if(mTarget>=63.5)mTarget=0;
  posIn.value=mTarget;
  if(!script&&phT>(RM?5.5:3.2)){phT=0;startScript()}
  if(FIXED&&window.__frame%180===90&&!script){reseed(false)}
 }
 if(script)runScript(dt);
 else if(auto&&simT>userUntil&&!FIXED){/* ghost idle */}

 layoutHorses(m,simT);
 drawPhasor(m);
 updateReadout(m);

 window.__state={
  m:+m.toFixed(3),mTarget:+mTarget.toFixed(3),nPairs,sel,
  morph:+morphT.toFixed(2),auto,frame:window.__frame,
  theta0:+(thetas()[0]||0).toFixed(5),
  ghost:!!script,t:+simT.toFixed(2)
 };
 if(!FIXED)requestAnimationFrame(frame);
}

/* ---- boot ---- */
reseed(true);
buildHorses();
// seed activity so first frames look alive
mTarget=FIXED?6:3.5;m=mTarget*0.6;posIn.value=mTarget;
if(FIXED){userUntil=-1;phT=0.5;auto=true}
layoutHorses(m,0);drawPhasor(m);updateReadout(m);

if(FIXED){window.step=n=>{for(let i=0;i<(n||1);i++)frame()};frame()}
else{window.step=()=>{};requestAnimationFrame(t=>{last=t;frame(t)})}
})();
</script>
</body></html>
